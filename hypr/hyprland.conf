# Brightness controls - multiple methods for compatibility
#bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
#bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
#Se desactivo para usar swayOSD
# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Reglas para el menú de WiFi flotante
#windowrulev2 = float, class:^(wifi_menu)$
#windowrulev2 = size 600 400, class:^(wifi_menu)$
#windowrulev2 = center, class:^(wifi_menu)$

# Efecto vidrio polarizado para Kitty (Sin desenfoque)
windowrule {
  name = kitty-vidrio
  match:class = ^(kitty)$
  
  no_blur = true
}

# Efecto vidrio polarizado para Nautilus (Sin desenfoque)
windowrule {
  name = nautilus-vidrio
  match:class = ^(org\.gnome\.Nautilus)$
  
  no_blur = true
}

windowrule {
  name = galeria-flotante
  match:class = com.hyperzen.galeria
  
  float = on
  center = on
  border_size = 0
  animation = popin
}

windowrule {
    # 1. El nombre obligatorio (puede ser lo que tú quieras)
    name = zapzap-floating

    # 2. La coincidencia con la clase usando Regex
    match:class = ^(ZapZap)$

    # 3. Los efectos deseados según la nueva tabla
    float = 1
    size = 1000 700
    center = 1
}

# --- Regla de Ventana Estilo Bloque para el QR de Wi-Fi ---
windowrule {
    name = wifi-qr-visuals
    match:class = wifi-qr

    # Comportamiento (Effects)
    float = on
    size = 450 520
    center = on
    pin = on
    stay_focused = on

    # Estética y Decoración
    border_size = 2
    rounding = 15
    border_color = rgba(89b4faff)
    opacity = 1.0 1.0

    # Efecto de enfoque extra
    dim_around = on
}

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
#windowrulev2 = suppressevent maximize,class:.*

# Fix some dragging issues with XWayland
#windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1

 # Laptop multimedia keys for volume and LCD brightness (Con SwayOSD)
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Brightness controls (Con SwayOSD)
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower

layerrule {
  name = neon_kwybars
  blur = on
  ignore_alpha = 0.1
  match:namespace = kwybars
}
